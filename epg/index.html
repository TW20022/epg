<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>EPG API</title>
<script>
async function run() {
    const urlParams = new URLSearchParams(window.location.search);
    const ch = urlParams.get("ch");
    const date = urlParams.get("date");

    if (!ch || !date) {
        document.body.innerHTML = "Usage: ?ch=频道名&date=YYYYMMDD";
        return;
    }

    const epg = await fetch("epg.json").then(r => r.json());

    if (!epg[ch]) {
        document.body.innerHTML = "频道不存在：" + ch;
        return;
    }

    let list = epg[ch][date] || [];

    // 核心修复逻辑：
    // 1. 移除第一条 "00:00" 开始的 "精彩呈现"（让它和能正常显示的第一份数据结构保持一致）
    // 2. 修复跨天时间：若 end 小于等于 start（如 23:35 -> 00:00），将 00:00 改为 24:00 避免解析崩溃
    list = list.filter(item => !(item.start === "00:00" && item.end === "00:24"));

    list = list.map(item => {
        if (item.end <= item.start) {
            // 将跨天的 00:00 修正为 24:00
            return { ...item, end: "24:00" };
        }
        return item;
    });

    const output = {
        channel_name: ch,
        date: date.slice(0,4) + "-" + date.slice(4,6) + "-" + date.slice(6,8),
        epg_data: list
    };

    document.body.innerHTML = "<pre>" + JSON.stringify(output, null, 2) + "</pre>";
}
run();
</script>
</head>
<body></body>
</html>
